background {
    monitor =
    color = rgba(1e1f28ff)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(bd92f8ff)
    inner_color = rgba(44475aff)
    font_color = rgba(f8f8f2ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = FantasqueSansM Nerd Font Mono Bold
    color = rgba(f8f8f2ff)
    position = 0, 120
    halign = center
    valign = center
}
