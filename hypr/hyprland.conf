# #######################################################################################
# Hyprland config — ghostON3
#
# Split into a portable core (this file) + an optional personal overlay
# (personal.conf.example → copy to personal.conf and source it at the bottom).
# Everything here runs on a clean Arch + Hyprland install with the deps in
# the repo README. The personal overlay wires my private tooling and is
# kept out of the public path on purpose.
# #######################################################################################


#################
### PLUGINS   ###
#################

# hyprexpo is built-in since Hyprland 0.40+
plugin:hyprexpo {
    columns = 3
    gap_size = 5
    bg_col = rgb(111111)
    workspace_method = first 1
}


################
### MONITORS ###
################

# Dual 4K. Adjust to your hardware — see https://wiki.hypr.land/Configuring/Monitors/
# Left monitor
monitor=DP-2,3840x2160@60,0x0,2
# Right monitor
monitor=DP-1,3840x2160@60,1920x0,2
# Sensible fallback for any other output
monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

exec-once = swww-daemon
exec-once = wl-paste --watch cliphist store
# Night-light tuned for Prague (lat/long). Change to your coordinates.
exec-once = wlsunset -l 50.08 -L 14.42


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us,sk
    kb_variant = ,qwerty
    kb_options = grp_led:caps

    follow_mouse = 1

    # -1.0 .. 1.0; this is the golden ratio (φ - 1), negated → calm, precise pointer
    sensitivity = -0.6180

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, V, centerwindow,
bind = $mainMod, R, exec, $menu

# Preselect split direction (controls where the next window opens)
bind = $mainMod, P, layoutmsg, preselect r
bind = $mainMod SHIFT, P, layoutmsg, preselect d
bind = $mainMod, T, layoutmsg, togglesplit

# Clipboard history
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy

# Browser
bind = $mainMod, B, exec, google-chrome-stable --new-window --profile-directory=Default

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Fullscreen
bind = $mainMod, F, fullscreen, 1

# Focus or launch VS Code (toggles back to the previous window on second press)
bind = $mainMod, C, exec, ~/.config/hypr/scripts/focus-or-launch.sh code-oss code

# Move floating windows with keyboard
bind = $mainMod CTRL, left, moveactive, -50 0
bind = $mainMod CTRL, right, moveactive, 50 0
bind = $mainMod CTRL, up, moveactive, 0 -50
bind = $mainMod CTRL, down, moveactive, 0 50

# Resize any window with keyboard
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces ON THE FOCUSED MONITOR (1-10 map to the monitor under focus,
# not absolute workspace numbers — see scripts/switch-workspace-current-monitor.sh)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/switch-workspace-current-monitor.sh 10

# Move active window to a workspace (respects current monitor)
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/move-window-workspace-current-monitor.sh 10

# Move active window to a workspace silently
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Scratchpad with workspace memory (stash a window away, bring it back where it came from)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/scratchpad.sh stash
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/scratchpad.sh unstash
bind = $mainMod, D, exec, ~/.config/hypr/scripts/scratchpad.sh unstash-silent

# Cycle workspaces on the current monitor only
bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (area copies to clipboard; full/window also save to ~/Pictures/Screenshots)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = CTRL SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

# Volume / mic
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# External monitor brightness over DDC/CI (needs ddcutil + i2c-dev; adjust --bus to your displays)
bindel = ,XF86MonBrightnessUp, exec, ddcutil setvcp 10 + 10 --bus 6 && ddcutil setvcp 10 + 10 --bus 7
bindel = ,XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 10 --bus 6 && ddcutil setvcp 10 - 10 --bus 7
bind = $mainMod, F6, exec, ddcutil setvcp 10 + 10 --bus 6 && ddcutil setvcp 10 + 10 --bus 7
bind = $mainMod, F5, exec, ddcutil setvcp 10 - 10 --bus 6 && ddcutil setvcp 10 - 10 --bus 7

# Media keys (needs playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Each monitor owns its own set of workspaces.
# Left monitor (DP-2): 1-5
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
# Right monitor (DP-1): 6-10
workspace = 6, monitor:DP-1, default:true
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}


###################
### PERSONAL     ###
###################

# My private tooling (Claude Code spawners, voice PTT, usage analytics, etc.)
# lives in a separate overlay so this file stays portable. Copy the example,
# fill in your own bindings, and uncomment the source line:
#
#   cp ~/.config/hypr/personal.conf.example ~/.config/hypr/personal.conf
#
# source = ~/.config/hypr/personal.conf
