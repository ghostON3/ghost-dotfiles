include ./theme.conf

font_family FantasqueSansM Nerd Font Mono
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.90
dynamic_background_opacity yes
confirm_os_window_close 0
cursor_trail 1
linux_display_server auto
scrollback_lines 10000
wheel_scroll_min_lines 1
enable_audio_bell no
window_padding_width 4

# Scrollback and path actions work even outside tmux.
map ctrl+shift+h show_scrollback
map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=clipboard
map ctrl+shift+c copy_or_noop
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+f search_scrollback
map ctrl+shift+l kitten hints --type line --program @ --ascending
map ctrl+shift+p kitten hints --type path --program @
map ctrl+shift+o kitten hints --type path --program default
