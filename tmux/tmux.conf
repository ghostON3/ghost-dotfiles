# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g update-environment "WAYLAND_DISPLAY DISPLAY SSH_AUTH_SOCK"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"
# Let apps such as Claude Code receive modified keys reliably inside tmux.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

# --- Vim-style pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Vim-style pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Intuitive splits (open in current path) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Vi copy mode ---
setw -g mode-keys vi
bind Enter copy-mode
# Prefix-free copy helpers for tmux-heavy workflows.
bind -n M-s copy-mode
bind -n M-g copy-mode \; send -X history-top
bind -n M-G copy-mode \; send -X history-bottom
bind -n M-l copy-mode \; send -X select-line \; send -X copy-pipe-and-cancel "wl-copy"
# Copy the entire pane history without entering copy mode.
bind -n M-a run-shell "tmux capture-pane -J -pS - | wl-copy"
bind Y run-shell "tmux capture-pane -J -pS - | wl-copy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Y send -X copy-pipe-line-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# --- Quick reload ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- tmx session picker (fzf popup) ---
bind f display-popup -E -w 80% -h 70% "tmx"
bind g display-popup -E -w 80% -h 70% "tmx ls; echo 'Press enter to close'; read"

# --- Voice input (whisper) ---
# Ctrl+A m → record 8s, transcribe, type into current pane
bind m run-shell "TMUX_PANE=#{pane_id} ~/.local/bin/voice 8 2>/tmp/voice.log && cat /tmp/voice.log"
# Ctrl+A M → popup showing voice output live
bind M display-popup -E -w 60% -h 30% "~/.local/bin/voice 8"

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#(~/.local/bin/codex-tmux-status '#{pane_id}')"
set -g status-right "#[fg=#a6adc8] %H:%M %d-%b"
set -g status-left-length 220
set -g status-right-length 40
setw -g window-status-current-style "fg=#89b4fa,bold"
setw -g window-status-style "fg=#6c7086"

# --- Pane borders ---
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Auto-restore last session
set -g @continuum-restore 'on'

# --- Init TPM (keep at bottom) ---
run '~/.tmux/plugins/tpm/tpm'
